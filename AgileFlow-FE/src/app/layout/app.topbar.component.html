<div class="layout-topbar">
  <a class="layout-topbar-logo" routerLink="/">
    <span class="font-bold text-xl">AgileFlow</span>
  </a>

  <button #menubutton class="p-link layout-menu-toggle layout-topbar-button"
    (click)="layoutService.onMenuToggle()">
    <i class="pi pi-bars"></i>
  </button>

  <div class="layout-topbar-menu" #topbarmenu>
    <div class="flex align-items-center gap-2">
      <span class="text-sm font-medium">{{ userName }}</span>
      <button class="p-link layout-topbar-button" (click)="logout()" pTooltip="Cerrar sesión">
        <i class="pi pi-sign-out"></i>
      </button>
    </div>
  </div>
</div>
